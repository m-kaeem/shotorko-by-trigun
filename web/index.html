<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shotorko by TRIGUN — Dengue early warning</title>
<meta name="description" content="Ward-level dengue outbreak forecasts 2–4 weeks ahead from lagged weather.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23070B16'/%3E%3Ccircle cx='24' cy='24' r='17' fill='none' stroke='%2322D3EE' stroke-width='2' opacity='.6'/%3E%3Cpath d='M24 12C24 12 16 21 16 26.5A8 8 0 0 0 32 26.5C32 21 24 12 24 12Z' fill='%2322D3EE'/%3E%3Ccircle cx='36' cy='13' r='3' fill='%23F43F5E'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ops.css">
<link rel="stylesheet" href="sim.css">
</head>
<body>
<header class="top reveal">
  <div class="brand">
    <a class="logo" href="#" aria-label="Shotorko home">
      <svg width="42" height="42" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-width="1.5"/>
        <circle cx="24" cy="24" r="13.5" fill="none" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/>
        <path class="sk-sweep" d="M24 24 L24 3 A21 21 0 0 1 42.2 13.5 Z" fill="#22D3EE" fill-opacity=".28"/>
        <path d="M24 14.5 C24 14.5 17.5 21.8 17.5 26.2 A6.5 6.5 0 0 0 30.5 26.2 C30.5 21.8 24 14.5 24 14.5 Z" fill="#22D3EE"/>
        <circle class="blip" cx="35.5" cy="14.5" r="2.4" fill="#F43F5E"/>
      </svg>
      <span>
        <span style="display:flex;align-items:baseline;gap:8px"><span class="name">Shotorko</span><span class="bnname" lang="bn">সতর্ক</span></span>
        <span class="tag" data-i="tagline"></span>
      </span>
    </a>
    <div class="byline">
      <em data-i="by"></em>
      <svg width="26" height="26" viewBox="0 0 64 64" role="img" aria-label="TRIGUN logo">
        <path class="tg-3" pathLength="120" d="M10 12 L50 9 L30 30 L50 35 L18 58" fill="none" stroke="#E8EEF9" stroke-width="7" stroke-linejoin="miter" stroke-linecap="square"/>
        <path class="tg-x" pathLength="120" d="M12 40 L40 60" fill="none" stroke="#22D3EE" stroke-width="7" stroke-linecap="square"/>
      </svg>
      <b>TRIGUN</b>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="map" aria-selected="true" data-i="tabMap"></button>
    <button role="tab" data-tab="trust" aria-selected="false" data-i="tabTrust"></button>
    <button role="tab" data-tab="ops" aria-selected="false" data-i="tabOps"></button>
    <button role="tab" data-tab="sim" aria-selected="false" data-i="tabSim"></button>
    <button role="tab" data-tab="data" aria-selected="false" data-i="tabData"></button>
    <button role="tab" data-tab="how" aria-selected="false" data-i="tabHow"></button>
  </nav>
  <div class="top-right">
    <button class="net-switch" id="netSwitch" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg><span data-i="simOffline"></span></button>
    <span class="net-badge" id="netBadge" role="status" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.7M19 12.9a10 10 0 0 0-2.1-1.6M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 11 4.6M12 20h.01"/></svg><span data-i="netOffline"></span></span>
        <div class="seg" role="group" aria-label="Data source">
      <button id="modeReplay" aria-pressed="true" data-i="replay"></button>
      <button id="modeLive" aria-pressed="false" data-i="live"></button>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button id="langEn" aria-pressed="true">EN</button>
      <button id="langBn" aria-pressed="false" lang="bn">বাংলা</button>
    </div>
    <button class="icon-btn" id="tourBtn" aria-label="Guided tour" title="Guided tour">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
    </button>
  </div>
</header>

<div class="ticker" aria-live="off"><div class="ticker-track" id="ticker"></div></div>

<main>
  <!-- ================= MAP TAB ================= -->
  <section class="tab active" id="tab-map" role="tabpanel">
    <div class="hero reveal" style="animation-delay:.08s">
      <div><h1 data-i="heroTitle"></h1><p data-i="heroText"></p></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <span class="eyebrow" data-i="forecastFor"></span>
        <div class="pills" id="horizons" role="group" aria-label="Forecast horizon"></div>
      </div>
    </div>

    <div class="timeline reveal" id="timeline" style="animation-delay:.14s">
      <button class="play" id="playBtn" aria-label="Play season">
        <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
      </button>
      <div class="when"><div class="eyebrow" data-i="weekOf"></div><div id="dateLabel">–</div></div>
      <div class="cal-wrap">
        <div class="stepper">
          <button class="step" id="prevMonth" data-i-title="prevMonth"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
          <button class="step" id="prevWeek" data-i-title="prevWeek"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="cal-btn" id="calBtn" aria-haspopup="dialog" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span id="calLabel">–</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button class="step" id="nextWeek" data-i-title="nextWeek"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          <button class="step" id="nextMonth" data-i-title="nextMonth"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"/></svg></button>
        </div>
        <div class="cal-pop" id="calPop" role="dialog" aria-label="Pick a week" hidden></div>
      </div>
      <span id="sampleBadge" class="badge"></span>
      <div class="seg" role="group" aria-label="Map shows">
        <button id="viewFc" aria-pressed="true" data-i="viewForecast"></button>
        <button id="viewAct" aria-pressed="false" data-i="viewActual"></button>
      </div>
    </div>

    <div id="liveInfo" class="action ok" style="display:none" data-i="liveInfo"></div>
    <div id="wxFresh" class="wx-fresh" role="status" hidden></div>

    <div class="kpis" id="kpis"></div>

    <section class="ops" id="ops" aria-labelledby="opsTitle"></section>

    <div class="grid">
      <section class="card map-card reveal" id="mapCard" aria-label="3D ward risk map" style="animation-delay:.3s">
        <div class="toolbar">
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="chips" id="cityChips" role="group" aria-label="Filter by city"></div>
          <button class="chip hosp-chip" id="hospToggle" aria-pressed="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i="hospitals"></span></button></div>
          <div class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <label class="sr-only" for="search">Search a ward</label>
            <input id="search" list="wardList" autocomplete="off">
            <datalist id="wardList"></datalist>
          </div>
        </div>
        <div class="stage" id="stage">
          <div class="rings"></div>
          <div id="deck"></div>
          <div class="radar"></div>
          <div id="rain"></div>
          <div class="labels" id="labels"></div>
          <div class="map-legend" id="legend"></div>
          <div class="map-tools">
            <button id="zoomIn" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            <button id="zoomOut" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <button id="resetView" aria-label="Reset view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
          </div>
          <div class="map-note" id="mapNote"></div>
        </div>
        <div class="toolbar">
          <h2 class="h-font" style="margin:0;font-size:18px" data-i="actFirst"></h2>
          <button class="btn" id="csvBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-i="download"></span></button>
        </div>
        <div class="top5" id="top5"></div>
      </section>

      <aside class="panel reveal" id="panel" aria-label="Selected ward forecast" aria-live="polite" style="animation-delay:.45s"></aside>
    </div>
  </section>

  <!-- ================= TRUST TAB ================= -->
  <section class="tab" id="tab-trust" role="tabpanel">
    <div class="hero"><div><h1 data-i="trustTitle"></h1><p data-i="trustText"></p></div>
      <div class="pills" id="trustH" role="group" aria-label="Horizon"></div></div>
    <div class="cards" id="trustCards"></div>
    <div class="two">
      <div class="card"><h3 class="sec-title" data-i="maeChart"></h3><div id="maeChart"></div></div>
      <div class="card"><h3 class="sec-title" data-i="splitTitle"></h3><table class="split" id="splitTable"></table></div>
    </div>
    <div class="card"><h3 class="sec-title" id="btTitle"></h3><div id="btChart"></div></div>
    <div class="card"><div class="toolbar"><div><h3 class="sec-title" data-i="heatTitle"></h3><small style="color:var(--muted)" data-i="heatSub"></small></div>
      <div class="seg" role="group" aria-label="Heatmap shows"><button id="heatPred" aria-pressed="true" data-i="viewForecast"></button><button id="heatObs" aria-pressed="false" data-i="viewActual"></button></div></div>
      <div id="heatmap" style="margin-top:12px"></div></div>
    <h2 class="h-font" style="margin:10px 0 0" data-i="splitsTitle"></h2>
    <p class="summary" style="color:var(--muted);font-size:14px;margin-top:-10px" data-i="splitsText"></p>
    <div class="cards three" id="splitCards"></div>
    <div class="two">
      <div class="card"><h3 class="sec-title" data-i="histTitle"></h3><div id="histChart"></div></div>
      <div class="card"><h3 class="sec-title" data-i="seasonTitle"></h3><div id="seasonChart"></div></div>
    </div>
    <div class="card"><h3 class="sec-title" data-i="accTitle"></h3><div id="accTable" style="overflow-x:auto;margin-top:8px"></div></div>
    <div class="card"><h3 class="sec-title" data-i="robTitle"></h3><small style="color:var(--muted)" data-i="robSub"></small><div id="robChart" style="margin-top:10px"></div></div>
    <div class="two">
      <div class="card"><h3 class="sec-title" data-i="cmTitle"></h3><div id="cmGrid" class="cm" style="margin-top:12px"></div></div>
      <div class="card"><h3 class="sec-title" data-i="monthTitle"></h3><div id="monthChart"></div></div>
    </div>
  </section>

  <!-- ================= OPERATIONS TAB (Phase 2: allocation + overflow routing, built by web/ops.js) ================= -->
  <section class="tab" id="tab-ops" role="tabpanel"></section>

  <!-- ================= CREW SIMULATOR TAB (Phase 2 Req 3: vector-control what-if, built by web/sim.js) ================= -->
  <section class="tab" id="tab-sim" role="tabpanel"></section>

  <!-- ================= YOUR DATA TAB ================= -->
  <section class="tab" id="tab-data" role="tabpanel">
    <div class="hero"><div><h1 data-i="dataTitle"></h1><p data-i="dataText"></p></div></div>
    <div class="two">
      <label class="drop-zone card" id="dropZone" for="fileIn">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#67E8F9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <b class="h-font" style="font-size:18px" data-i="dropTitle"></b>
        <span style="color:var(--muted);font-size:13px" data-i="dropSub"></span>
        <input id="fileIn" type="file" accept=".csv,text/csv" class="sr-only">
      </label>
      <div class="card" style="display:flex;flex-direction:column;gap:10px">
        <h3 class="sec-title" data-i="formatTitle"></h3>
        <div id="formatList" style="font-size:14px;line-height:1.6;color:var(--ink-2)"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="/api/sample.csv" download><span data-i="sampleBtn"></span></a>
        <button class="btn" id="trySample" style="background:var(--cyan);color:var(--night);border-color:var(--cyan)"><span data-i="trySample"></span></button></div>
      </div>
    </div>
    <div id="uploadOut"></div>
  </section>

  <!-- ================= HOW TAB ================= -->
  <section class="tab" id="tab-how" role="tabpanel">
    <div class="hero"><div><h1 data-i="howTitle"></h1><p data-i="howText"></p></div></div>
    <div class="clock-bar"><i id="clockFill"></i></div>
    <div class="clock" id="clock"></div>
    <h2 class="h-font" style="margin:8px 0 0" data-i="underHood"></h2>
    <div class="cards" id="hood"></div>
    <p class="summary" style="color:var(--muted);font-size:14px" data-i="dataNote"></p>
  </section>
  <div class="footer" data-i="footer"></div>
</main>

<div id="tour" role="dialog" aria-modal="true" aria-label="Guided tour"><div class="hole"></div><div class="tip"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="vendor/deck.gl-9.4.1.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="ops.js"></script>
<script src="sim.js"></script>
</body>
</html>
